<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blustery Bulwark of SPLORR!!</title>
<style>
	html, body { margin: 0; height: 100%; background: #1a1c2c; color: #94b0c2; overflow: hidden; }
	body { display: flex; flex-direction: column; align-items: center; justify-content: center; font: 12px monospace; }
	canvas {
		image-rendering: pixelated;
		width: min(100vw, calc((100vh - 40px) * 384 / 216));
		height: min(calc(100vh - 40px), calc(100vw * 216 / 384));
		touch-action: none;
	}
	footer { margin-top: 4px; text-align: center; max-width: 96vw; line-height: 1.3; }
	footer a { color: #aaa; }
</style>
</head>
<body>
<canvas id="screen" width="384" height="216"></canvas>
<footer>
	Blustery Bulwark of SPLORR!! by TheGrumpyGameDev. Code made by an AI agent (Claude Code) at the author's direction.
	Tiles: Urizen by vurmux (CC0). Font: DINOBYTE by mby (CC BY 4.0). Feedback by LootLocker.
	<a href="#" id="feedback-link">Send feedback (F)</a> · <a href="https://thegrumpygamedev.itch.io/">itch.io</a> · <a href="https://playdeezgames.github.io/oeuvre-of-splorr/">more games</a>
</footer>
<script src="odin.js"></script>
<script src="lootlocker.js"></script>
<script>
(async function () {
	const canvas = document.getElementById("screen");
	const ctx = canvas.getContext("2d");

	// Feedback through the shared SPLORR!! LootLocker kit. The LootLocker game for this Metaphor is not set up
	// yet (the user's console setup: Guest Login, CORS Allowlist, a Game feedback category); until domain and
	// key are filled in, the form opens but cannot send.
	const ll = LootLocker({ domain: "", key: "", version: "0.0.1", idKey: "bbos-ll-player" });
	const feedback = ll.feedbackDialog({ game: "Blustery Bulwark of SPLORR!!" });
	document.getElementById("feedback-link").addEventListener("click", (e) => { e.preventDefault(); feedback.open(); });

	const memory = new odin.WasmMemoryInterface();
	await odin.runWasm("game.wasm", null, {}, memory);
	const ex = memory.exports;
	const W = ex.platform_screen_w(), H = ex.platform_screen_h();

	// game.Command order (src/game/game.odin): North South West East NorthWest NorthEast SouthWest SouthEast
	// Wait Confirm Cancel.
	const C = { N: 0, S: 1, W: 2, E: 3, NW: 4, NE: 5, SW: 6, SE: 7, WAIT: 8, CONFIRM: 9, CANCEL: 10 };
	const KEYS = {
		ArrowUp: C.N, ArrowDown: C.S, ArrowLeft: C.W, ArrowRight: C.E,
		Numpad8: C.N, Numpad2: C.S, Numpad4: C.W, Numpad6: C.E,
		Numpad7: C.NW, Numpad9: C.NE, Numpad1: C.SW, Numpad3: C.SE,
		Home: C.NW, PageUp: C.NE, End: C.SW, PageDown: C.SE,
		Numpad5: C.WAIT, Period: C.WAIT, Space: C.WAIT,
		Enter: C.CONFIRM, NumpadEnter: C.CONFIRM, Escape: C.CANCEL,
	};
	window.addEventListener("keydown", (e) => {
		if (e.code === "KeyF" && !e.repeat) { e.preventDefault(); feedback.open(); return; }
		if (!(e.code in KEYS)) return;
		e.preventDefault();
		const c = KEYS[e.code];
		if (e.repeat && c > C.WAIT) return; // held keys repeat moves and waits only
		ex.platform_command(c);
	});

	// Mouse and touch: a click or tap goes to the game in framebuffer pixels. The touch d-pad arrives in step 1.
	canvas.addEventListener("contextmenu", (e) => e.preventDefault());
	canvas.addEventListener("pointerdown", (e) => {
		const r = canvas.getBoundingClientRect();
		const x = Math.floor((e.clientX - r.left) * W / r.width), y = Math.floor((e.clientY - r.top) * H / r.height);
		ex.platform_pointer(x, y, e.button === 2 ? 2 : 0);
	});

	// Gamepad (standard mapping): d-pad or left stick to move (diagonals from the stick), A confirm, B cancel,
	// X wait. Held directions repeat after 12 frames, then every 6.
	const pad = { held: -1, frames: 0, buttons: [] };
	function stickCommand(gp) {
		const b = (i) => gp.buttons[i] && gp.buttons[i].pressed;
		let dx = (b(15) ? 1 : 0) - (b(14) ? 1 : 0), dy = (b(13) ? 1 : 0) - (b(12) ? 1 : 0);
		if (!dx && !dy && gp.axes.length >= 2) {
			const ax = gp.axes[0], ay = gp.axes[1];
			if (Math.hypot(ax, ay) > 0.5) {
				const a = Math.round(Math.atan2(ay, ax) / (Math.PI / 4));
				dx = Math.round(Math.cos(a * Math.PI / 4)); dy = Math.round(Math.sin(a * Math.PI / 4));
			}
		}
		const table = { "0,-1": C.N, "0,1": C.S, "-1,0": C.W, "1,0": C.E, "-1,-1": C.NW, "1,-1": C.NE, "-1,1": C.SW, "1,1": C.SE };
		return (dx || dy) ? table[dx + "," + dy] : -1;
	}
	function pollPad() {
		const gp = navigator.getGamepads ? Array.from(navigator.getGamepads()).find((g) => g) : null;
		if (!gp) return;
		const d = stickCommand(gp);
		if (d !== pad.held) { pad.held = d; pad.frames = 0; if (d >= 0) ex.platform_command(d); }
		else if (d >= 0 && ++pad.frames >= 12) { pad.frames = 6; ex.platform_command(d); }
		[[0, C.CONFIRM], [1, C.CANCEL], [2, C.WAIT]].forEach(([i, c]) => {
			const now = !!(gp.buttons[i] && gp.buttons[i].pressed);
			if (now && !pad.buttons[i]) ex.platform_command(c);
			pad.buttons[i] = now;
		});
	}

	// odin.js runs the game's step; this loop polls the gamepad and copies new frames.
	const image = ctx.createImageData(W, H);
	function frame() {
		pollPad();
		if (ex.platform_frame_ready()) {
			// Read the buffer after the call: wasm memory may have grown.
			image.data.set(new Uint8Array(memory.memory.buffer, ex.platform_frame_ptr(), W * H * 4));
			ctx.putImageData(image, 0, 0);
		}
		requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);
})();
</script>
</body>
</html>
